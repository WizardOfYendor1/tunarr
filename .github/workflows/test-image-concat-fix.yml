# Builds a linux/amd64 test image of this branch and attaches it to the run as
# a `docker load`-able tar. Not for release; delete with the branch.
name: Test image (mpegts concat fix)

on:
  push:
    branches:
      - test-image/mpegts-concat-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. When both repository secrets are set, the image is also
      # pushed to Docker Hub as <username>/tunarr:concat-fix.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        run: echo "TUNARR_BUILD=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image tar
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          target: full-stack
          build-args: |
            base_image_tag=7.1.1
            is_edge_build=false
            tunarr_version=concat-fix
            tunarr_build=${{ env.TUNARR_BUILD }}
            exec_target=linux-x64
          tags: tunarr:concat-fix
          outputs: type=docker,dest=${{ runner.temp }}/tunarr-concat-fix.tar

      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker load -i "${{ runner.temp }}/tunarr-concat-fix.tar"
          docker tag tunarr:concat-fix "$DOCKERHUB_USERNAME/tunarr:concat-fix"
          docker push "$DOCKERHUB_USERNAME/tunarr:concat-fix"

      - name: Compress
        run: gzip -1 "${{ runner.temp }}/tunarr-concat-fix.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: tunarr-concat-fix-image
          path: ${{ runner.temp }}/tunarr-concat-fix.tar.gz
          retention-days: 14
          compression-level: 0
